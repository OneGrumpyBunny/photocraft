name: Dalivinci builds

# Builds Dalivinci for 64-bit Windows (portable folder) and 64-bit Linux (a tar.gz, which keeps
# the executable bits an artifact would drop; it runs under WSL on Windows 11) from the ai-panel
# branch, or on demand. Each is attached to the run as an artifact; GitHub shows each artifact's
# SHA-256 digest on the run page. Builds are not code-signed.

on:
  push:
    branches: [ai-panel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dalivinci-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TARGET: x86_64-pc-windows-msvc
      # Static CRT, as packaging/windows/package.ps1 does: no VC++ redistributable needed.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      PHOTOCRAFT_REQUIRE_WINRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: |
          $env:PHOTOCRAFT_BUILD_SHA = '${{ github.sha }}'
          $env:PHOTOCRAFT_BUILD_DATE = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          cargo build --release --locked -p photocraft -p photocraft-cli --features heif --target $env:TARGET

      - name: Package portable folder
        id: package
        shell: pwsh
        run: |
          $short = '${{ github.sha }}'.Substring(0, 7)
          $name = "dalivinci-$short-windows-x64-portable"
          $bin = "target\$env:TARGET\release"
          New-Item -ItemType Directory -Force -Path "dist\$name" | Out-Null
          Copy-Item "$bin\photocraft.exe", "$bin\photocraft-cli.exe" "dist\$name"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, NOTICE, packaging\windows\portable.txt "dist\$name"
          & "dist\$name\photocraft-cli.exe" --version
          "name=$name" >> $env:GITHUB_OUTPUT

      # The folder itself, so the download is one zip rather than a zip inside a zip.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}
          retention-days: 30

  linux:
    # 22.04's glibc (2.35) keeps the binary runnable on newer distributions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          export PHOTOCRAFT_BUILD_SHA='${{ github.sha }}'
          export PHOTOCRAFT_BUILD_DATE="$(date -u +%F)"
          cargo build --release --locked -p photocraft -p photocraft-cli --features heif

      - name: Package tarball
        id: package
        run: |
          name="dalivinci-${GITHUB_SHA::7}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/photocraft target/release/photocraft-cli "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE packaging/windows/portable.txt "dist/$name/"
          "dist/$name/photocraft-cli" --version
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### $name.tar.gz" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$(sha256sum "dist/$name.tar.gz" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.tar.gz
          retention-days: 30
