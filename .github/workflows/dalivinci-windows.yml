name: Dalivinci Windows build

# Builds the Dalivinci portable zip for 64-bit Windows from the ai-panel branch, or on demand.
# The zip is attached to the run as an artifact; its SHA-256 is printed in the run summary so the
# download can be checked with Get-FileHash. Builds are not code-signed.

on:
  push:
    branches: [ai-panel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dalivinci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TARGET: x86_64-pc-windows-msvc
      # Static CRT, as packaging/windows/package.ps1 does: no VC++ redistributable needed.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      PHOTOCRAFT_REQUIRE_WINRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: |
          $env:PHOTOCRAFT_BUILD_SHA = '${{ github.sha }}'
          $env:PHOTOCRAFT_BUILD_DATE = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          cargo build --release --locked -p photocraft -p photocraft-cli --features heif --target $env:TARGET

      - name: Package portable zip
        id: package
        shell: pwsh
        run: |
          $short = '${{ github.sha }}'.Substring(0, 7)
          $name = "dalivinci-$short-windows-x64-portable"
          $bin = "target\$env:TARGET\release"
          New-Item -ItemType Directory -Force -Path "dist\$name" | Out-Null
          Copy-Item "$bin\photocraft.exe", "$bin\photocraft-cli.exe" "dist\$name"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, NOTICE, packaging\windows\portable.txt "dist\$name"
          & "dist\$name\photocraft-cli.exe" --version
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash
          "name=$name" >> $env:GITHUB_OUTPUT
          "### $name.zip`n`nSHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.zip
          retention-days: 30
